name: Release proot-latest（滚动）

# 源码、安装器或构建配置变更时刷新滚动 Release；工作流文本变更不触发重建。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "c/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go/**"
  workflow_dispatch:

# 同一滚动版本串行发布，避免并发覆盖资产。
concurrency:
  group: release-proot-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-latest:
    uses: ./.github/workflows/release.yml
    secrets: inherit
