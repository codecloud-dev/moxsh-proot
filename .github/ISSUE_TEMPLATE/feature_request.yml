name: 💡 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感谢建议！描述清楚"想解决什么问题"比"怎么实现"更重要。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 目前什么场景下不方便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它是什么样？（与上游 PRoot 行为不一致的话请说明）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 相关范围
      options:
        - 引擎核心（ptrace / 路径翻译 / ELF）
        - 容器命令面（-r/-0/-b/-w/-R/-S/-e）
        - moxsh-proot-distro 子命令
        - 网络栈
        - 钩子体系
        - 安装器 / CI / 发布
        - 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue，没有重复建议
          required: true
