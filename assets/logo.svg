<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="moxsh-proot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13243f"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fd1bf"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
  </defs>

  <!-- 应用磁贴：圆角方块，扁平深底 -->
  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#bg)"/>
  <rect x="24.5" y="24.5" width="207" height="207" rx="47.5" fill="none" stroke="#2a3b57" stroke-width="1"/>

  <!-- 终端窗口 -->
  <rect x="62" y="70" width="132" height="116" rx="16" fill="#0c1a2e" stroke="url(#accent)" stroke-width="3"/>
  <!-- 标题栏三点 -->
  <circle cx="82" cy="90" r="5" fill="#ff5f56"/>
  <circle cx="98" cy="90" r="5" fill="#ffbd2e"/>
  <circle cx="114" cy="90" r="5" fill="#27c93f"/>

  <!-- 提示符 > （品牌主视觉：终端 + 无根之根语义的渐变） -->
  <path d="M88 126 L108 146 L88 166" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 光标：竖向方块 -->
  <rect x="122" y="128" width="9" height="36" rx="3" fill="url(#accent)">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- 无根之根：从窗口底部发出的细根（rootless root —— 不取特权而获 root 能力） -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M128 186 C128 198 128 204 128 214"/>
    <path d="M128 200 C118 204 112 208 106 214"/>
    <path d="M128 200 C138 204 144 208 150 214"/>
  </g>
</svg>
