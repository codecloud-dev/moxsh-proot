# 可复用发布工作流（worker）——被两条路径调用：
#   1. release-latest.yml：push 到 main（源码/装器/CI 变更时）→ 滚动 proot-latest
#   2. 本文件的 push tag `proot-v*` 触发器 → 版本发布（如 proot-v1.0.0）
# 也可 workflow_dispatch 手动补发。
#
# 为什么拆调用方：`on.push` 同时写 tags 与 paths 时，paths 过滤会 AND 到
# tag 事件上，tag 推送的 paths 匹配依赖 diff 计算，可能被意外跳过；
# 拆开后 tag 路径无 paths 过滤，永远全量构建。
on:
  workflow_call:
  push:
    tags: ["proot-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-engine:
    name: 引擎（${{ matrix.name }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Termux / Android（build.rs 会经 cc 编 c/proot_bridge.c，需 NDK）
          - target: aarch64-linux-android
            name: android-arm64
            legacy_name: aarch64-linux-android
            ndk: "true"
          - target: x86_64-linux-android
            name: android-amd64
            legacy_name: x86_64-linux-android
            ndk: "true"
          # 桌面 Linux glibc 动态版（体积小，依赖系统 glibc）
          - target: x86_64-unknown-linux-gnu
            name: linux-amd64
            legacy_name: ""
            ndk: "false"
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
            legacy_name: ""
            ndk: "false"
            cross_pkg: gcc-aarch64-linux-gnu
          # 桌面 Linux musl 静态版（零依赖，Go 安装器 LibcMusl 通道首选）。
          # musl target 的 crt 对象来自 rustup 自包含目录，但 rustc 默认仍
          # 调 `cc` 作链接驱动——跨架构时落到宿主 gcc（EM 架构不匹配，
          # "Relocations in generic ELF (EM: 183)"）。必须显式交叉链接器。
          - target: x86_64-unknown-linux-musl
            name: linux-amd64-musl
            legacy_name: ""
            ndk: "false"
          - target: aarch64-unknown-linux-musl
            name: linux-arm64-musl
            legacy_name: ""
            ndk: "false"
            cross_pkg: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: 安装交叉 gcc（aarch64-gnu）
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: 安装 NDK 26.1.10909125（android）
        if: matrix.ndk == 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            yes | "$SDKMANAGER" "ndk;26.1.10909125" > /dev/null
          else
            echo "NDK 26.1.10909125 已预装，跳过安装"
          fi

      # 链接器 / C 编译器按 target 分派：
      #   - android：NDK clang wrapper（cc crate 1.5.1 认 <var>_<target> 横杠形式；
      #     rustc 链接需 CARGO_TARGET_<TRIPLE>_LINKER）。API 28 起：
      #     libc::getrandom 自 bionic API 28 才有符号（crypto.rs 直调 +
      #     urandom 运行时兜底），README 最低要求即 Android 9 = API 28
      #   - aarch64-gnu / aarch64-musl：apt 的 aarch64-linux-gnu-gcc。
      #     musl 的 crt 对象由 rustup 自包含提供，但 rustc 默认仍以 `cc`
      #     为链接驱动——跨架构会落到宿主 gcc（EM 架构不匹配），须显式指定
      #   - x86_64-musl：宿主即 x86_64，默认 `cc` 直链即可
      - name: 配置 CC / AR / LINKER
        run: |
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              NDK="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
              echo "CC_aarch64-linux-android=$NDK/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
              echo "AR_aarch64-linux-android=$NDK/llvm-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/aarch64-linux-android28-clang" >> "$GITHUB_ENV"
              ;;
            x86_64-linux-android)
              NDK="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin"
              echo "CC_x86_64-linux-android=$NDK/x86_64-linux-android28-clang" >> "$GITHUB_ENV"
              echo "AR_x86_64-linux-android=$NDK/llvm-ar" >> "$GITHUB_ENV"
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK/x86_64-linux-android28-clang" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              echo "CC_aarch64-unknown-linux-gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            aarch64-unknown-linux-musl)
              # crt 对象走 rustup 自包含 musl；链接驱动必须交叉 gcc
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
          esac

      - name: cargo build --release（两个 bin）
        run: cargo build --release --target ${{ matrix.target }} --bins

      # 资产双命名（缺一即有一侧安装器死链）：
      #   - <name>：Go 安装器 AssetName 约定 moxsh-proot-<goos>-<arch>[-musl]
      #   - <legacy_name>：bash 一键脚本约定 moxsh-proot-<triple>（仅 android）
      - name: 收集产物
        run: |
          mkdir -p dist
          for bin in moxsh-proot moxsh-proot-distro; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/${bin}-${{ matrix.name }}"
            if [ -n "${{ matrix.legacy_name }}" ]; then
              cp "target/${{ matrix.target }}/release/$bin" "dist/${bin}-${{ matrix.legacy_name }}"
            fi
          done
          ls -la dist/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'proot-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'proot-latest' }}
          files: dist/*
          fail_on_unmatched_files: true

  build-installer:
    name: Go 安装器（${{ matrix.goos }}-${{ matrix.goarch }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: android
            goarch: arm64
          - goos: android
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: 构建（纯标准库，CGO 关闭可交叉）
        working-directory: go
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "-s -w" \
            -o "../dist/moxsh-installer-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/moxsh-installer
      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'proot-latest' }}
          files: dist/*
          fail_on_unmatched_files: true

  # 两个 build job 各自上传，最后统一生成全量 SHA256SUMS。
  # bash 安装器按 <asset>.sha256 成对寻址（fetch_asset 逻辑），Go 安装器
  # 同样支持 <asset>.sha256 —— 单个 SHA256SUMS 供人肉核对，<asset>.sha256
  # 供安装器自动拉取，两者都要。
  checksums:
    name: 生成 SHA256SUMS 与逐资产校验文件
    needs: [build-engine, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 从 Release 拉回全部资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'proot-latest' }}
        run: |
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
      - name: 生成 SHA256SUMS 与 <asset>.sha256
        working-directory: dist
        run: |
          rm -f SHA256SUMS *.sha256
          sha256sum -- * > SHA256SUMS
          while read -r hash file; do
            printf '%s\n' "$hash" > "${file}.sha256"
          done < SHA256SUMS
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
      - name: 上传校验文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'proot-latest' }}
          files: dist/SHA256SUMS
          fail_on_unmatched_files: true
