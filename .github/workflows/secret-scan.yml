name: secret-scan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # 先验证规则本身没被改坏，再扫仓库；规则失效会直接让 CI 红
      - name: 校验扫描规则覆盖度
        run: python3 .github/scripts/check_secrets.py --self-test
      - name: 扫描误提交的密钥
        run: python3 .github/scripts/check_secrets.py
