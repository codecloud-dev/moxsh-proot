name: Release proot-latest（滚动）

# push 到 main 且源码/装器/CI 有变更时，调用可复用发布工作流刷新
# `proot-latest`——scripts/install-mox-proot.sh 与 mox-proot-installer 的
# 默认 RELEASE 都是 proot-latest，该 release 不存在 = 一键安装死链。
#
# 版本发布走 release.yml 自己的 tag 触发器（proot-v*），不经本文件。
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "c/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "go/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-latest.yml"
  workflow_dispatch:

# 滚动 Release 会重建并覆盖同一个 `proot-latest` 的全部资产。两个 run 并发时
# 会互相删/传同名附件（实测并发补传出现过 DELETE 404）。串行排队，绝不取消
# 已在跑的那个，保证任何时刻国内镜像都是自洽的一套二进制。
concurrency:
  group: release-proot-latest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-latest:
    uses: ./.github/workflows/release.yml
    # reusable workflow 默认【不继承】调用方的 secrets，必须显式 inherit：
    # 否则 release.yml 里 secrets.GITEE_TOKEN 为空 → 资产列表 GET（公开可读）能过，
    # 但 DELETE/POST 一律 401「登录失效」，镜像 job 必然失败（实测 08:29 复现）。
    secrets: inherit
