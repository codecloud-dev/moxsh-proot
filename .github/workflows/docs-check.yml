name: 文档与脚本一致性检查

# scripts/ 与 README 的质量门（push 到 main / PR 均执行）：
#   - bootstrap.sh 语法检查（sh -n）
#   - 短命令同步检查：README 里的 base64 内嵌命令必须与 bootstrap.sh 对得上
#    （防改了 bootstrap 忘更新文档——那条命令是用户唯一可见的安装入口）
#   - install-moxsh-proot.sh 语法检查 + 分流用例自测（probe/pick 逻辑回归）
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "README.md"
      - "README.en.md"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

jobs:
  docs-check:
    name: 语法 + 短命令同步 + 分流回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bootstrap.sh 语法检查
        run: sh -n scripts/bootstrap.sh
      - name: install-moxsh-proot.sh 语法检查
        run: sh -n scripts/install-moxsh-proot.sh
      - name: 短命令与 README 同步检查
        run: bash scripts/gen-shortcmd.sh --check
      - name: 分流逻辑自测（用例集）
        run: bash scripts/test-source-pick.sh
      - name: mox 脚本两端一致性
        run: bash scripts/test-console-sync.sh
