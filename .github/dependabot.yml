# 依赖自动更新（按月分组，只收 minor/patch；major 需人工评估）
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    ignore:
      # actions 大版本升级会连带改 runner 镜像、Node/Python 默认版本与
      # 权限模型，必须由人工跑一遍完整 CI 再决定，不收自动 PR。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]